# Builds the live page from files already in the repository and publishes it
# with GitHub Pages (build sheet C9). It reads reports/, README.md and two
# documents under docs/; it has no access to market data, which is never in
# the repository (hard rule 1). No dependencies are installed: the builder
# uses the standard library only.
#
# One-time setup, by the repository owner: Settings -> Pages -> Source ->
# "GitHub Actions". Until that is done this workflow fails at the deploy step
# and publishes nothing.
name: pages

on:
  push:
    branches: [main]
    paths: ["reports/**", "README.md", "docs/findings.md", "docs/investigations.md",
            "scripts/build_site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/build_site.py site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

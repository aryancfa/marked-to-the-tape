# Runs the test suite on every push and pull request (build sheet B1, B7).
# The tests use synthetic data only, so no market data or credentials are
# needed here, and none must ever be added.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -v
